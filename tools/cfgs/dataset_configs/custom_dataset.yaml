# Custom Dataset config for the Waymo 3D smoke (10-frame probe).
# Adapted from the stock OpenPCDet custom_dataset.yaml.
# Grid aligned to cfgs/waymo_models/pointpillar_1x.yaml so the model cfg's
# DATA_CONFIG override is a no-op and create_custom_infos (which reads THIS
# file, not the model cfg) agrees with training.
DATASET: 'CustomDataset'
DATA_PATH: '../data/custom'   # symlink -> /workspace/datasets/waymo/pcdet_custom

# Pillar grid, matched to pointpillar_1x.yaml. VOXEL z = full z-range -> nz=1.
POINT_CLOUD_RANGE: [-74.88, -74.88, -2, 74.88, 74.88, 4.0]

MAP_CLASS_TO_KITTI: {
    'Vehicle': 'Car',
    'Pedestrian': 'Pedestrian',
    'Cyclist': 'Cyclist',
}

# SMOKE: val == train (throwaway, leaked number -- proves the loop runs only).
# create_custom_infos reads ImageSets/train.txt AND val.txt, so val.txt must
# exist; make it a copy of train.txt (see commands).
DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [custom_infos_train.pkl],
    'test': [custom_infos_val.pkl],
}

# 4 features (x, y, z, intensity) -> matches preprocessor_to_PCDet output.
POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

DATA_AUGMENTOR:
    # SMOKE: gt_sampling DISABLED. It needs a correct GT database + dbinfos and
    # is the classic first-run failure point on a new/tiny custom dataset
    # (empty or tiny DB from 10 frames, box-count mismatches). The smoke only
    # needs loss to drop; re-enable for the real run.
    DISABLE_AUG_LIST: ['gt_sampling']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          USE_ROAD_PLANE: False
          DB_INFO_PATH:
              - custom_dbinfos_train.pkl
          PREPARE: {
             filter_by_min_points: ['Vehicle:5', 'Pedestrian:5', 'Cyclist:5'],
          }
          SAMPLE_GROUPS: ['Vehicle:20', 'Pedestrian:15', 'Cyclist:15']
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: True

        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    # Matched to pointpillar_1x.yaml (the model cfg overrides this at train
    # time anyway; kept identical so create_custom_infos agrees).
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.32, 0.32, 6.0]
      MAX_POINTS_PER_VOXEL: 20
      MAX_NUMBER_OF_VOXELS: {
        'train': 150000,
        'test': 150000
      }
